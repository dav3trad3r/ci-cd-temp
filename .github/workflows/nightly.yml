# Nightly: slower or costlier checks that should not hold up every pull request.
# - AI evaluation against its baseline (costs money once the classifier calls a model)
# - Known vulnerabilities in production dependencies
# Add end-to-end browser tests (Playwright) here when the tool has real user journeys.

name: Nightly

on:
  schedule:
    - cron: "0 17 * * *" # 3 am Brisbane time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-checks:
    name: Slow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: AI evaluation against the baseline
        run: npm run eval
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
