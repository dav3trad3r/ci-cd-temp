# Afternoon platform report: drift, resources made outside the code, changes, alerts, yesterday's
# spend and what shipped. Scripts gather the facts with read-only access, an agent (Claude on
# Microsoft Foundry) writes them up, and the report goes to a Teams channel. People act on it.
#
# Does nothing until Azure is connected: set the AZURE_CLIENT_ID, AZURE_TENANT_ID and
# AZURE_SUBSCRIPTION_ID repository variables (README, "Afternoon platform report").

name: Daily report

on:
  schedule:
    - cron: "0 5 * * 1-5" # 3 pm Brisbane time, Monday to Friday
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # sign in to Azure with OIDC: no stored Azure credentials

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    name: Afternoon report
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Sign in to Azure (read-only identity, OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI extensions
        run: |
          az extension add --name resource-graph --upgrade --only-show-errors
          az bicep install --only-show-errors

      - name: Write and send the report
        run: npm run report
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          # Searching other repositories in the organisation needs a token that can read them.
          GITHUB_TOKEN: ${{ secrets.REPORT_GITHUB_TOKEN || github.token }}
