# CodeQL code scanning: finds injection, unsafe redirects, weak crypto and similar
# patterns. Results appear under Security → Code scanning. Free on public repos.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 17 * * 0" # weekly, Monday 3:23 am Brisbane time

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
